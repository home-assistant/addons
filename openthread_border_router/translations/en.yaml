---
configuration:
  device:
    name: Device
    description: The serial port where the OpenThread RCP radio is attached.
  baudrate:
    name: Baudrate
    description: >-
      The serial port baudrate used to communicate with the Silicon Labs radio.
  flow_control:
    name: Hardware flow control
    description: Enable hardware flow control for serial port.
  backbone_interface:
    name: Backbone Network Interface
    description: >-
      The network interface used for the backbone network.
      If not specified, it falls back to the primary interface.
  network_device:
    name: Network Device
    description: >-
      <host:port> when connecting to a device via sockets (takes precedence
      over above configuration). Not recommended! See documentation for more
      information.
  otbr_log_level:
    name: OpenThread Border Router agent log level
    description: >-
      Set logging level of the OpenThread Border Router agent (otbr-agent).
  firewall:
    name: OTBR firewall
    description: >-
      Use OpenThread Border Router firewall to block unnecessary traffic.
  nat64:
    name: NAT64
    description: >-
      Enable IPv6 to IPv4 network address translation. This allows Thread
      devices to communicate with devices on the Internet.
  mdns_guard:
    name: mDNS storm guard
    description: >-
      Rate-cap LAN-side multicast mDNS on the backbone interface with
      nftables, so a multicast amplification storm cannot starve the host.
      Unicast SRP/mDNS discovery and all Thread radio rules are untouched.
  mdns_guard_extra:
    name: mDNS storm guard - extra protocols
    description: >-
      Also rate-cap LLMNR (5355) and SSDP (1900) multicast in addition to
      mDNS. Disable if a service on this box relies on high-rate LLMNR/SSDP
      traffic.
  srp_server_mode:
    name: SRP server mode
    description: >-
      Placement policy for the fabric's SRP server: auto (Thread arbitrates,
      default), leader (run only while this box is the BBR primary - set
      leader on EVERY border router of a multi-BR mesh so service
      registrations pin to one deterministic router and fail over
      automatically), always, or off.
  backbone_qos:
    name: Backbone QoS (TREL DSCP marking)
    description: >-
      Mark Thread backbone (TREL) egress with a DSCP class so the switch can
      keep the Thread control/data plane out of the best-effort queue when it
      shares trunks with video. Marks only; no effect until the switch honors
      the class.
  backbone_qos_dscp:
    name: Backbone QoS DSCP class
    description: >-
      DSCP class stamped on TREL egress (default cs5). Must match the class
      the switch maps to the protected queue.
  beta:
    name: Beta
    description: >-
      Enable beta mode to run a newer, experimental version of OpenThread
      Border Router.
  custom_omr_prefix:
    name: Custom OMR prefix
    description: >-
      Force a specific Off-Mesh Routable (OMR) prefix, e.g. fd42:0001::/64.
      Leave empty to derive a deterministic prefix from the Thread network
      name, so every border router on the mesh converges on the same OMR
      prefix automatically. A stable prefix across restarts prevents the
      multi-border-router routing loop (fc00::/7 catch-all route).
  custom_omr_priority:
    name: OMR prefix preference
    description: >-
      Route preference for the OMR prefix: high, med (default), or low.
      In multi-border-router setups, set this lower on backup routers so the
      primary is preferred by LAN hosts.
  leader_weight:
    name: Leader weight
    description: >-
      Thread leader weight (0-255, default 72). Influences which border
      router is elected as Thread partition leader. Set higher on the primary
      router and lower on backups for stable leader election.
network:
  8080/tcp: OpenThread Web port
  8081/tcp: OpenThread REST API port
