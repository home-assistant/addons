---
configuration:
  backend:
    name: Backend
    description: >-
      The text-to-speech engine to use. `piper` is fast and runs on any
      hardware. `omnivoice` is experimental: much higher quality, supports
      voice cloning, but it is much slower and really wants a desktop or
      server CPU. It will run on other hardware, but expect it to be too slow
      to be useful there.
  voice:
    name: Voice
    description: >-
      The Piper voice to use. Voices are named according to the following
      scheme: `<language>-<name>-<quality>`. Ignored when the backend is
      `omnivoice`, which picks its voice per request.
  speaker:
    name: Speaker
    description: >-
      Speaker number to use if the voice supports multiple speakers.
      By default, the first speaker (speaker 0) will be used.
  length_scale:
    name: Length scale
    description: >-
      Speeds up or slows down the voice. A value of 1.0 means to use the voice's
      default speaking rate, with < 1.0 being faster and > 1.0 being slower.
  noise_scale:
    name: Noise scale
    description: >-
      Controls the variability of audio by adding noise during audio generation.
      The effect highly depends on the voice itself, but in general a value of 0
      removes variability and values above 1 will start to degrade audio.
  noise_w:
    name: Speaking cadence
    description: >-
      Controls the variability of speaking cadence (phoneme widths). The effect
      highly depends on the voice itself, but in general a value of 0 removes
      variability and values above 1 produce extreme stutters and pauses.
  sentence_silence:
    name: Sentence silence
    description: >-
      Adds the given number of seconds of silence after every sentence.
  omnivoice_steps:
    name: OmniVoice steps
    description: >-
      Number of decode steps for the `omnivoice` backend. Fewer steps are
      faster, more steps sound better. Only used when the backend is
      `omnivoice`.
  enable_japanese:
    name: Japanese support
    description: >-
      Download the Japanese phonemizer, needed for Japanese voices. Around
      350 MB is downloaded the first time this is turned on.
  enable_thai:
    name: Thai support
    description: >-
      Download the Thai phonemizer, needed for Thai voices. Around 390 MB is
      downloaded the first time this is turned on.
  update_voices:
    name: Update voices
    description: >-
      Download the list of new voices automatically every time the app
      starts.  You must also reload the Wyoming integration for Piper in Home
      Assistant to see new voices.
  debug_logging:
    name: Debug logging
    description: >-
      Print DEBUG level messages to the app's log.
network:
  10200/tcp: Piper Wyoming Protocol
