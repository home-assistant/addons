---
configuration:
  dirsfirst:
    name: Directories First
    description: >-
      This option allows you to list directories before files in the file
      browser tree.
  enforce_basepath:
    name: Enforce Basepath
    description: >-
      If set to `true`, access is limited to files within the `/config`
      directory.
  git:
    name: Git
    description: >-
      If set to `true`, the app will initialize git for directories that
      support it.
  ignore_pattern:
    name: Ignore Pattern
    description: >-
      This option allows you to hide files and folders from the file browser
      tree.
  log_level:
    name: Log Level
    description: >-
      Controls how much the file editor logs. At `info`, every web request is
      logged, including the Docker health check every 30 seconds; `warning`
      logs only problems.
  ssh_keys:
    name: SSH Keys
    description: >-
      A list of filenames containing SSH private keys. These can be used to
      allow for access to remote git repositories.
