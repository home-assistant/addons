---
version: 4.0.0
breaking_versions: [4.0.0]
slug: openthread_border_router
name: OpenThread Border Router
description: OpenThread Border Router app
url: >-
  https://github.com/home-assistant/addons/tree/master/openthread_border_router
arch:
  - aarch64
  - amd64
homeassistant: 2025.7.0
gpio: true
hassio_api: true
discovery:
  - otbr
# IPC is only used within the Add-on
host_ipc: false
host_network: true
host_uts: true
privileged:
  - IPC_LOCK
  - NET_ADMIN
devices:
  - /dev/net/tun
image: homeassistant/{arch}-addon-otbr
init: false
options:
  device: null
  baudrate: "460800"
  flow_control: true
  otbr_log_level: notice
  firewall: true
  nat64: false
  mdns_guard: true
  mdns_guard_extra: true
  srp_server_mode: auto
  backbone_qos: true
  backbone_qos_dscp: "cs5"
  beta: false
  custom_omr_prefix: ""
  custom_omr_priority: "med"
  leader_weight: 72
ports:
  8080/tcp: null
  8081/tcp: null
ports_description:
  8080/tcp: OpenThread Web port
  8081/tcp: OpenThread REST API port
schema:
  device: device(subsystem=tty)
  baudrate: list(57600|115200|230400|460800|921600|1000000)
  flow_control: bool
  backbone_interface: str?
  network_device: str?
  otbr_log_level: list(debug|info|notice|warning|error|critical|alert|emergency)
  firewall: bool
  nat64: bool
  mdns_guard: bool
  mdns_guard_extra: bool
  srp_server_mode: list(auto|always|off|leader)?
  backbone_qos: bool
  backbone_qos_dscp: list(be|cs1|cs2|cs3|cs4|cs5|cs6|cs7|af11|af12|af13|af21|af22|af23|af31|af32|af33|af41|af42|af43|ef)
  beta: bool?
  custom_omr_prefix: str?
  custom_omr_priority: list(high|med|low)?
  leader_weight: int
startup: services
